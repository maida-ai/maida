<?xml version='1.0' encoding='UTF-8'?><svg xmlns="http://www.w3.org/2000/svg" width="144" height="128" viewBox="0 0 144 128" role="img" aria-labelledby="title desc"><style>:root { --maida-paper: #F2F1EB; --maida-ink: #171A17; --maida-mint: #78D6A2; --maida-coral: #ED7958; } #logo-dot { fill: var(--maida-coral); } #logo-left-bracket, #logo-right-bracket { fill: var(--maida-ink); } @media (prefers-color-scheme: dark) { #logo-left-bracket, #logo-right-bracket { fill: var(--maida-paper); } }</style><title id="title">Maida symbol</title><desc id="desc">A solid circle inside two open square brackets.</desc><g transform="translate(16 16) scale(1)"><g id="maida-symbol"><path id="logo-left-bracket" d="M0 0H36V16H16V80H36V96H0Z" /><circle id="logo-dot" cx="56" cy="48" r="20" /><path id="logo-right-bracket" d="M112 0H76V16H96V80H76V96H112Z" /></g></g></svg>
