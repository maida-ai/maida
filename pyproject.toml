[project]
name = "maida-ai"
dynamic = ["version", "readme"]
description = "Don't let broken agent changes merge."
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [
    { name = "z-a-f", email = "zafar@maida.ai" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141.0,<0.142.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-proto>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pyyaml>=6.0.3,<6.1.0",
    "typer>=0.27.0,<0.28.0",
    "uvicorn>=0.53.0,<0.54.0",
]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",

  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/maida-ai/maida"

[project.scripts]
maida = "maida.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0,<5.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",       # Coverage
    "pytest-randomly>=5.0.0",  # Random test order
    "pytest-xdist>=3.8.0",     # Parallel tests
    "ruff>=0.16.9",
]

[project.optional-dependencies]
langchain = ["langchain>=1.4.2"]
# CrewAI extra removed after v0.5.3: crewai pins block Python 3.14 and openai upgrades.
# Adapter code remains under maida.integrations.crewai until those conflicts resolve.
openai = [
    "openai-agents>=0.22.3",
]

[build-system]
# Wheel/sdist include maida/ (and thus maida/ui_static/) by default.
# Do not add only-include or only-packages that would exclude ui_static.
requires = ["hatchling>=1.32.4,<1.33.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maida"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "maida/schemas"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"

[tool.hatch.build.hooks.version]
path = "maida/_version.py"
template = '''
# This file is managed by dynamic versioning. Do not edit manually.
version = "{version}"'''

[tool.hatch.metadata.hooks.custom]
path = "scripts/hatch_hooks/readme_links_rewrite.py"
